<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Runner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TELA INICIAL -->
    <section id="start-screen" class="screen">

        <div class="start-box">

            <h1>English Runner</h1>

            <p class="subtitle">
                Run, find the letters and learn English!
            </p>

            <label>Your name</label>
            <input
                type="text"
                id="player-name"
                placeholder="Enter your name"
                maxlength="15"
            >

            <h2>Choose your character</h2>

            <div class="characters">

                <button class="character selected" data-character="boy">
                    <div class="character-preview boy-preview">
                        <div class="head"></div>
                        <div class="body"></div>
                        <div class="arm left-arm"></div>
                        <div class="arm right-arm"></div>
                        <div class="leg left-leg"></div>
                        <div class="leg right-leg"></div>
                    </div>
                    <span>Boy</span>
                </button>

                <button class="character" data-character="girl">
                    <div class="character-preview girl-preview">
                        <div class="head"></div>
                        <div class="hair"></div>
                        <div class="body"></div>
                        <div class="arm left-arm"></div>
                        <div class="arm right-arm"></div>
                        <div class="leg left-leg"></div>
                        <div class="leg right-leg"></div>
                    </div>
                    <span>Girl</span>
                </button>

            </div>

            <button id="start-button">
                START GAME
            </button>

        </div>

    </section>


    <!-- JOGO -->
    <section id="game-screen" class="screen hidden">

        <header class="game-header">

            <div>
                <small>PLAYER</small>
                <strong id="display-name">PLAYER</strong>
            </div>

            <div class="target-container">
                <small>WORD</small>
                <div id="word-display"></div>
            </div>

            <div>
                <small>SCORE</small>
                <strong id="score">0</strong>
            </div>

        </header>


        <main id="game-area">

            <!-- cenário -->
            <div class="sky"></div>

            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>

            <div class="mountains"></div>

            <div class="ground">
                <div class="ground-line"></div>
            </div>

            <!-- letras aparecem aqui -->
            <div id="letters-container"></div>

            <!-- personagem -->
            <div id="player" class="player">

                <div class="player-head"></div>
                <div class="player-hair"></div>

                <div class="player-body"></div>

                <div class="player-arm player-arm-left"></div>
                <div class="player-arm player-arm-right"></div>

                <div class="player-leg player-leg-left"></div>
                <div class="player-leg player-leg-right"></div>

            </div>

            <!-- mensagem -->
            <div id="message"></div>

        </main>


        <div class="controls">

            <button id="jump-button">
                ↑
                <span>JUMP</span>
            </button>

            <p>
                Press <b>SPACE</b> or <b>↑</b> to jump
            </p>

        </div>

    </section>


    <script src="data/words.js"></script>
    <script src="game.js"></script>

</body>
</html>
